plugins { id 'com.android.application' }
android {
  namespace 'ir.motalla.app'
  compileSdk 34
  defaultConfig {
    applicationId 'ir.motalla.app'
    minSdk 24
    targetSdk 34
    // هر ساخت شماره بالاتری می‌گیرد تا نصب روی نسخه قبلی ممکن باشد
    versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger() + 100)
    versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
  }
  signingConfigs {
    // کلید امضا فقط از GitHub Secrets (ANDROID_KEYSTORE_B64 / ANDROID_KEY_PASS / ANDROID_KEY_ALIAS) می‌آید؛
    // هیچ کلید یا رمزی داخل مخزن نیست (کلید قدیمی چون مخزن عمومی است لو رفته بود و کنار گذاشته شد).
    release {
      def ks = System.getenv('ANDROID_KEYSTORE_FILE')
      if (ks) {
        storeFile file(ks)
        storePassword System.getenv('ANDROID_KEY_PASS')
        keyAlias System.getenv('ANDROID_KEY_ALIAS')
        keyPassword System.getenv('ANDROID_KEY_PASS')
      }
    }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.release }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
