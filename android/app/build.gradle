plugins { id 'com.android.application' }
android {
  namespace 'ir.motalla.app'
  compileSdk 34
  defaultConfig {
    applicationId 'ir.motalla.app'
    minSdk 24
    targetSdk 34
    // هر ساخت شماره بالاتری می‌گیرد تا نصب روی نسخه قبلی ممکن باشد
    versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger() + 100)
    versionName '1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
  }
  signingConfigs {
    // کلید امضا از GitHub Secrets خوانده می‌شود (ANDROID_KEYSTORE_B64 / ANDROID_KEY_PASS / ANDROID_KEY_ALIAS).
    // تا وقتی آن‌ها تنظیم نشده‌اند، کلید قدیمی داخل مخزن استفاده می‌شود تا ساخت APK نشکند.
    release {
      def ks = System.getenv('ANDROID_KEYSTORE_FILE')
      storeFile file(ks ?: 'motalla-release.keystore')
      storePassword(System.getenv('ANDROID_KEY_PASS') ?: 'motalla2026')
      keyAlias(System.getenv('ANDROID_KEY_ALIAS') ?: 'motalla')
      keyPassword(System.getenv('ANDROID_KEY_PASS') ?: 'motalla2026')
    }
  }
  buildTypes {
    release { minifyEnabled false; signingConfig signingConfigs.release }
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
