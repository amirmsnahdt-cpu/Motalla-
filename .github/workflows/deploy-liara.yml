name: استقرار روی لیارا
# تنها راه استقرار: هر push به main (لیارا روزانه تعداد استقرار محدود دارد، پس چند push پشت‌سرهم یکی می‌شوند)
on:
  push:
    branches: [main]
    paths-ignore: ['android/**', '**.md', '.github/workflows/android-apk.yml', '.github/workflows/fetch-fonts.yml']
  schedule:
    - cron: '35 20 * * *'   # ۰۰:۰۵ تهران
    - cron: '45 0 * * *'    # ۰۴:۱۵ تهران (اگر سقف روزانه لیارا با ساعت جهانی صفر شود)
    - cron: '0 4 * * *'     # ۰۷:۳۰ تهران
  workflow_dispatch:
permissions: { contents: write }
jobs:
  wait:
    runs-on: ubuntu-latest
    concurrency: { group: liara-wait, cancel-in-progress: true }
    steps:
      - name: صبر برای جمع شدن تغییرات پشت‌سرهم
        if: github.event_name == 'push'
        run: sleep 150
  deploy:
    needs: wait
    runs-on: ubuntu-latest
    concurrency: { group: liara-deploy, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - name: بررسی وجود توکن و لزوم استقرار
        env: { LIARA_API_TOKEN: '${{ secrets.LIARA_API_TOKEN }}' }
        run: |
          if [ -z "$LIARA_API_TOKEN" ]; then echo "::warning::توکن لیارا (LIARA_API_TOKEN) تنظیم نشده"; echo "SKIP=1" >> $GITHUB_ENV; exit 0; fi
          WANT=$(grep -o 'const APP_V=[0-9.]*' index.html | head -1 | cut -d= -f2)
          HAVE=$(curl -s -m 30 --retry 3 https://motalla.liara.run/api/status | grep -o '"v":[0-9.]*' | cut -d: -f2 || true)
          echo "::notice::repo=$WANT server=$HAVE"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -n "$HAVE" ] && [ "$WANT" = "$HAVE" ]; then echo "::notice::سرور به‌روز است یا در دسترس نیست؛ استقرار زمان‌بندی‌شده لازم نیست"; echo "SKIP=1" >> $GITHUB_ENV; fi
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with: { node-version: '22' }
      - name: تست سرور
        if: env.SKIP != '1'
        run: node --experimental-sqlite --disable-warning=ExperimentalWarning -e "require('./server/server.js');console.log('server loads ok');process.exit(0)"
        env: { DATA_DIR: /tmp/motalla-test }
      - name: استقرار
        if: env.SKIP != '1'
        env: { LIARA_API_TOKEN: '${{ secrets.LIARA_API_TOKEN }}', LIARA_APP: '${{ vars.LIARA_APP }}' }
        run: |
          npm i -g @liara/cli@5 >/dev/null 2>&1
          set +e
          liara deploy --app="${LIARA_APP:-motalla}" --api-token="$LIARA_API_TOKEN" --region=iran --no-app-logs > out.txt 2>&1
          code=$?
          cat out.txt
          if [ $code -ne 0 ]; then
            # لاگ کامل در شاخه deploy-logs ذخیره می‌شود تا بشود علت را دید
            sed 's/\x1b\[[0-9;]*m//g' out.txt > /tmp/deploy-log.txt
            git config user.name motalla-bot; git config user.email motalla-bot@users.noreply.github.com
            git fetch origin deploy-logs 2>/dev/null && git checkout -q -B deploy-logs origin/deploy-logs || git checkout -q --orphan deploy-logs
            git rm -rq --cached . 2>/dev/null || true
            cp /tmp/deploy-log.txt last-deploy.txt; git add last-deploy.txt; git commit -qm "deploy log $(date -u +%FT%TZ)" && git push -q origin deploy-logs || true
            tail -n 6 out.txt | sed 's/\x1b\[[0-9;]*m//g' | grep -v '^\s*$' | while IFS= read -r l; do echo "::error::$l"; done
            exit $code
          fi
