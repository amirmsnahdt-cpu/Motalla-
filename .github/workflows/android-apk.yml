name: ساخت اپ اندروید (APK)
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: کلید امضا از Secrets (اگر تنظیم شده باشد)
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
          else
            echo "::warning::کلید امضا در Secrets نیست؛ کلید قدیمی داخل مخزن استفاده شد"
          fi
      - name: ساخت APK
        env: { ANDROID_KEY_PASS: '${{ secrets.ANDROID_KEY_PASS }}', ANDROID_KEY_ALIAS: '${{ secrets.ANDROID_KEY_ALIAS }}' }
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - run: cp android/app/build/outputs/apk/release/app-release.apk motalla.apk
      - uses: actions/upload-artifact@v4
        with: { name: motalla-apk, path: motalla.apk }
      - name: انتشار در Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: اپ اندروید مطلا
          body: فایل نصبی اندروید مطلا. اطلاعات روی سرور است؛ با نصب نسخه جدید چیزی پاک نمی‌شود.
          files: motalla.apk
          make_latest: true
      - name: ذخیره APK در مخزن تا از سرور لیارا (داخل ایران) دانلود شود
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist && cp motalla.apk dist/motalla.apk
          git config user.name "motalla-bot"
          git config user.email "motalla-bot@users.noreply.github.com"
          git add dist/motalla.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "فایل نصب اندروید جدید برای دانلود از سرور"
          # فقط main؛ استقرار لیارا با کار «استقرار روی لیارا» انجام می‌شود
          git push origin HEAD:main
