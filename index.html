:root[data-theme="dark"]{--bg:#0a1222;--card:#121c32;--ink:#edf1fa;--mut:#99a5bf;--line:#24324f;--navy:#0c1730;--navy2:#1a2c52;--pri:#8fb2ff;--pri2:#1a2846;--gold:#e2b558;--gold2:#6b5320;--goldbg:#2a2210;--red:#ff7a90;--red2:#3a1520;--warn:#f3c053;--warn2:#352a0e;--ok:#5bd68f;--ok2:#0f2e1e;--dock:rgba(16,27,52,.95);--btn:linear-gradient(135deg,#3666c9,#244c9e)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,'Segoe UI',sans-serif;font-size:15px;line-height:1.65;font-weight:500;font-feature-settings:"tnum"}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
@media(min-width:600px){body{background:#e2e7f0}#app{background:var(--bg);box-shadow:0 0 50px #13284f1a}}
@media(min-width:600px) and (prefers-color-scheme:dark){body{background:#060c18}}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- هدر ---------- */
#bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 14px;min-height:62px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#bar .ttl{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
#bar .ttl b{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{width:38px;height:38px;border-radius:11px 11px 11px 3px;background:var(--navy);color:var(--gold2);display:grid;place-items:center;font-weight:900;font-size:19px;flex:none;box-shadow:inset 0 0 0 1.5px #c99a3a88}
.ib0{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.dchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:5px 10px 5px 8px;cursor:pointer;text-align:right;flex:none;max-width:56%}
.dchip svg{color:var(--gold);width:18px;height:18px}
.dchip .t{display:flex;flex-direction:column;line-height:1.2}.dchip b{font-size:13.5px;font-weight:800;white-space:nowrap}.dchip small{font-size:10.5px;color:var(--mut);direction:ltr;text-align:right;white-space:nowrap}
.dchip.flash{animation:fl .7s ease}@keyframes fl{0%{box-shadow:0 0 0 0 #c99a3a99}100%{box-shadow:0 0 0 10px #c99a3a00}}
/* ---------- بدنه ---------- */
#view{flex:1;padding:4px 14px 20px}
#view.in{animation:in .2s ease}@keyframes in{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
.muted{color:var(--mut)}.sp8{height:8px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 2px 8px}.sec-h b{font-size:15.5px;font-weight:800}.sec-h .link{padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
/* شمش: کارت جمع کل */
.ingot{position:relative;overflow:hidden;border-radius:20px;padding:16px 16px 14px;margin-bottom:12px;color:#f6efdb;background:radial-gradient(120% 140% at 100% 0%,#24477f 0%,#13284f 55%,#0c1a36 100%);box-shadow:0 14px 30px #13284f33}
.ingot::after{content:'';position:absolute;inset:auto -30% -60% auto;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#c99a3a40,transparent 70%)}

/* ================= v21 — طراحی مینیمال (هم‌سبک گزارش PDF) ================= */
:root{--bg:#f5f6f8;--ink:#16213a;--mut:#7a8294;--line:#e7e9ef;--hair:#eef0f4;--red:#c2414b;--red2:#fcecee;--ok:#15803d;--ok2:#e9f6ef;--gold:#b8862b;--gold2:#ecd9a6;--goldbg:#fbf6e8;--pri2:#eef2f9;--warn:#9a6a12;--warn2:#fbf4e3;--sh:0 1px 2px #16213a0a,0 10px 28px -14px #16213a29;--goldbar:linear-gradient(90deg,#ecc874,#b8862b);--seg:#eceef3;--btn:#16213a}

/* کارت‌ها */

.ingot::after{display:none}

.ingot .row3{margin:14px -16px 0;gap:0;border-top:1px solid var(--hair)}
.ingot .row3>div{flex:1;padding:10px 16px 11px;border-left:1px solid var(--hair)}.ingot .row3>div:last-child{border-left:0}
.ingot .row3 small{color:var(--mut);font-size:11px;font-weight:600}.ingot .row3 b{color:var(--ink);font-size:16px;font-weight:800}.ingot .row3 b.r{color:var(--red)}
.ingot>*:last-child:not(.row3){margin-bottom:14px}

/* دکمه‌ها */
.btn{min-height:52px;border-radius:15px;font-weight:800;background:var(--btn);transition:transform .12s,filter .2s}

const gcd=(a,b)=>b?gcd(b,a%b):a;
function best(items,cap,maxCount){if(!items.length||cap<=0)return[];
  const greedy=()=>{let rem=cap;const out=[];[...items].sort((a,b)=>b.amount-a.amount).forEach(x=>{if((!maxCount||out.length<maxCount)&&x.amount<=rem){out.push(x);rem-=x.amount}});return out};
  if(maxCount>0)return greedy();
  const u=items.reduce((a,x)=>gcd(a,x.amount),0),C=Math.floor(cap/u);if(C>3e6)return greedy();
  const dp=new Int32Array(C+1).fill(-1);dp[0]=-2;items.forEach((x,k)=>{const a=x.amount/u;for(let s=C;s>=a;s--)if(dp[s]===-1&&dp[s-a]!==-1)dp[s]=k});
  let s=C;while(s>0&&dp[s]===-1)s--;const out=[];while(s>0){const k=dp[s];out.push(items[k]);s-=items[k].amount/u}return out}
